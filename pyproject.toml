[project]
name = "Speiseplan"
version = "0.9.0"
description = "Jörgs Speisekartenplaner"
authors = [{ name = "Andy Grabow", email = "andy@freilandkiwis.de" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "django==5.2.17",
    "django-secrets==1.2.4",
    "django-extensions==4.1",
    "dj-static==0.0.6",
    "django-compressor==4.6.0",
    "django-axes==7.1.0",
    "pypugjs==5.13.0",
    "django-post-office==3.11.3",
    "uwsgidecorators==1.1.0",
    "huepy==1.2.1",
    "djangorestframework==3.18.1",
    "requests==2.34.2",
    "pendulum==3.2.0",
    "pillow==11.3.0",
    "django-cors-headers==4.9.0",
    "icecream==2.2.0",
    "django-sass-processor==1.4.2",
    "gunicorn==23.0.0",
    "django-jazzmin==3.0.5",
    "django-ckeditor==6.7.3",
    "weasyprint==52.5",
    "django-filter==25.2",
    "libsass==0.23.0",
    "django-undeletable==1.1.2",
]
editable = false

[project.urls]
Homepage = "https://github.com/kakulukia/django-default-project"
Repository = "https://github.com/kakulukia/django-default-project"

[dependency-groups]
dev = [
    "django-debug-toolbar==5.2.0",
    "ipdb==0.13.13",
    "django-browser-reload==1.21.0",
    "ruff==0.16.10",
    "ipython==9.17.1",
    "fab-classic==1.21.0",
    "paramiko==3.5.1",
]

[tool.uv]
package = false
default-groups = "all"

[tool.uv.sources]
fab-classic = { git = "https://github.com/kakulukia/fab-classic.git", rev = "master" }

[tool.black]
line-length = 99
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
/migrations/  # exclude django migrations
'''

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[flake8]
exclude = ['.git', 'migrations']
max-line-length = 140
